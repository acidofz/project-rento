[project]
name = "rento"
version = "0.1.0"
description = "RENTO - p2p rental platform built with Reflex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reflex>=0.6.8",
    "supabase>=2.15.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
