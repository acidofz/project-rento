services:
  - type: web
    name: project-rento
    runtime: python
    plan: free
    buildCommand: uv sync --frozen
    startCommand: uv run reflex run --env prod --backend-only --backend-port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
