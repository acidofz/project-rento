services:
  - type: web
    name: uy-click
    runtime: python
    plan: free
    buildCommand: uv sync --frozen && uv run reflex export --no-zip --env prod
    startCommand: uv run reflex run --env prod --single-port --frontend-port $PORT --backend-host 0.0.0.0 --backend-port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
