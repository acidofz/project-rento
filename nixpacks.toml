[phases.setup]
# Node is required for `reflex export` (Vite/npm). Without a build phase, Reflex
# recompiles `.web` on every container start — slow boots and deploy timeouts.
nixPkgs = ["...", "nodejs_22"]

[phases.install]
cmds = [
  "uv sync --frozen"
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "uv run reflex export --no-zip --env prod"
]

[start]
cmd = "uv run reflex run --env prod --single-port --frontend-port $PORT --backend-host 0.0.0.0 --backend-port $PORT"
